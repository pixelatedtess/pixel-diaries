<style>

/* =========================================================
   WIDGET
   ========================================================= */

.cbox-book-widget {
  width: 100%;
  min-height: 285px;

  display: flex;
  flex-direction: column;

  justify-content: center;
  align-items: center;

  padding: 12px 0;

/* =========================================================

   ========================================================= */

.cbox-book.open .book-inside {

/* =========================================================

.book-page {

/* =========================================================

.left-page::after {

/* =========================================================

.left-page::before,

/* FRONT */

.cover-front {

.cover-front img {

/* INSIDE OF COVER */

.cover-back {

    linear-gradient(

.cover-back::after {

/* LIGHT ACROSS COVER */

.cover-light {

/* =========================================================
   COVER OPENING
   ========================================================= */

.cbox-book.open .book-cover {

@keyframes realisticCoverOpen {

  }

  }

  92% {

  }

}


/* =========================================================

.turn-page {

/* =========================================================

/* =========================================================
   CURL HIGHLIGHT

.page-front::after,

    );

/* =========================================================
   PAGE TURN TIMING

.cbox-book.open .page-three {

.cbox-book.open .page-four {

    0.83s
    forwards;

  z-index: 31;
}


/* =========================================================
   REALISTIC PAGE TURN

   The page compresses horizontally as it approaches
   the camera edge-on, lifts slightly, then settles.
   ========================================================= */

@keyframes naturalPageTurn {

  0% {
    opacity: 0;

    transform:
      perspective(1100px)
      rotateY(0deg)
      rotateZ(0deg)
      scaleX(1)
      scaleY(1)
      translateY(0);

    filter:
      brightness(1);
  }


  3% {
    opacity: 1;
  }


  /* outer corner lifts */

  12% {
    transform:
      perspective(1100px)
      rotateY(-9deg)
      rotateZ(-0.15deg)
      scaleX(0.998)
      scaleY(1.002)
      translateY(-0.3px);

    filter:
      brightness(1.01);
  }


  /* page starts curling */

  25% {
    transform:
      perspective(1100px)
      rotateY(-31deg)
      rotateZ(-0.5deg)
      scaleX(0.985)
      scaleY(1.006)
      translateY(-1px);

    filter:
      brightness(0.97);
  }


  /* strongest curl */

  40% {
    transform:
      perspective(1100px)
      rotateY(-66deg)
      rotateZ(-0.8deg)
      scaleX(0.955)
      scaleY(1.009)
      translateY(-1.7px);

    filter:
      brightness(0.91);
  }


  /* edge-on */

  50% {
    transform:
      perspective(1100px)
      rotateY(-91deg)
      rotateZ(-0.45deg)
      scaleX(0.935)
      scaleY(1.011)
      translateY(-1.4px);

    filter:
      brightness(0.82);
  }


  /* backside appears */

  61% {
    transform:
      perspective(1100px)
      rotateY(-119deg)
      rotateZ(0.45deg)
      scaleX(0.952)
      scaleY(1.009)
      translateY(-1px);

    filter:
      brightness(0.90);
  }


  /* page begins falling */

  75% {
    transform:
      perspective(1100px)
      rotateY(-151deg)
      rotateZ(0.7deg)
      scaleX(0.982)
      scaleY(1.004)
      translateY(-0.3px);

    filter:
      brightness(0.96);
  }


  /* tiny overshoot */

  90% {
    opacity: 1;

    transform:
      perspective(1100px)
      rotateY(-183deg)
      rotateZ(-0.18deg)
      scaleX(1.003)
      scaleY(1);

    filter:
      brightness(0.99);
  }


  /* bounce back */

  96% {
    opacity: 1;

    transform:
      perspective(1100px)
      rotateY(-178.5deg)
      rotateZ(0.08deg)
      scaleX(1);

    filter:
      brightness(1);
  }


  /* settles flat */

  100% {
    opacity: 0;

    transform:
      perspective(1100px)
      rotateY(-180deg)
      rotateZ(0deg)
      scaleX(1)
      scaleY(1);

    filter:
      brightness(1);
  }

}


/* =========================================================
   CURL LIGHT ANIMATIONS
   ========================================================= */

.cbox-book.open .page-one .page-front::after,
.cbox-book.open .page-one .page-back::after {

.cbox-book.open .page-two .page-front::after,

.cbox-book.open .page-three .page-front::after,

@keyframes curlLight {

  }


  12% {

  }

  }


  72% {

  }


  90% {

  }

/* =========================================================

   ========================================================= */

.cbox-book::after {

<script>

(function () {

  /* =====================================================
     APPLY USER SETTINGS
     ===================================================== */

  var coverImage =
    document.getElementById("bookCoverImage");

  var cbox =
    document.getElementById("bookCbox");

  if (typeof BOOK_WIDGET_SETTINGS !== "undefined") {

    if (
      coverImage &&
      BOOK_WIDGET_SETTINGS.BOOK_COVER_IMAGE
    ) {
      coverImage.src =
        BOOK_WIDGET_SETTINGS.BOOK_COVER_IMAGE;
    }

    if (
      cbox &&
      BOOK_WIDGET_SETTINGS.CBOX_URL
    ) {
      cbox.src =
        BOOK_WIDGET_SETTINGS.CBOX_URL;
    }

  }


  var book =
    document.getElementById("chatBook");

  var cover =
    document.getElementById("bookCover");

  var closeButton =
    document.getElementById("closeBook");

  var openText =
    document.getElementById("openText");


  if (!book || !cover || !closeButton || !openText) {
    return;
  }


  /* =====================================================
     OPEN BOOK
     ===================================================== */

  cover.addEventListener(
    "click",
    function () {

      if (!book.classList.contains("open")) {

        book.classList.remove("closing");

        book.classList.add("open");

        openText.style.opacity = "0";

      }

    }
  );


  /* =====================================================
     CLOSE BOOK
     ===================================================== */

  closeButton.addEventListener(
    "click",
    function (event) {

      event.preventDefault();
      event.stopPropagation();

      book.classList.remove("open");

      openText.style.opacity = "1";

    }
  );

})();

</script>
